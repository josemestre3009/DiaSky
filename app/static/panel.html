<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DiaSky | Operaciones</title>
  <style>
    :root { --ink:#e7eee7; --paper:#0d1412; --panel:#151f1b; --line:#2a3932; --muted:#9baaa2; --green:#2bba7d; --red:#ff7777; --amber:#f4be4c; --blue:#75b7ee; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 85% 0,#15382b 0,transparent 32%),var(--paper); color:var(--ink); font:14px system-ui,-apple-system,Segoe UI,sans-serif } button,input,select,textarea { font:inherit }
    .auth { max-width:390px; margin:14vh auto; padding:30px; background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 50px #0008 } h1,h2,h3,p { margin-top:0 } h1 { font:700 28px Georgia,serif; letter-spacing:-.4px } .eyebrow { color:var(--green); font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:1px } input,select,textarea { width:100%; border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:10px; background:#0e1613 } textarea { min-height:75px; resize:vertical } button { cursor:pointer; border:0; border-radius:7px; padding:10px 14px; background:var(--green); color:#082015; font-weight:800 } button.subtle { color:var(--ink); background:#26342e } button.danger { background:var(--red) } .error { color:var(--red); min-height:20px; margin-top:10px }
    #app { display:none; max-width:1440px; padding:25px; margin:auto } header { display:flex; justify-content:space-between; align-items:start; gap:16px; margin-bottom:22px } header h1 { margin:3px 0 0 } .actions { display:flex; gap:8px; align-items:center } .metrics { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px } .metric { border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--panel) } .metric b { display:block; font:700 28px Georgia,serif } .metric span { color:var(--muted); font-size:12px }.filters { display:grid; grid-template-columns:170px 1fr 170px 140px auto; gap:8px; padding:12px; border:1px solid var(--line); background:var(--panel); border-radius:10px; margin-bottom:16px }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px } .list,.detail { border:1px solid var(--line); background:var(--panel); border-radius:10px; overflow:hidden } table { border-collapse:collapse; width:100% } th,td { text-align:left; border-bottom:1px solid #22302a; padding:11px 10px; vertical-align:top } th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px } tr.order { cursor:pointer } tr.order:hover,tr.order.selected { background:#1e332a }.badge { white-space:nowrap; display:inline-block; padding:3px 7px; border-radius:99px; font-size:11px; font-weight:700; background:#2b3932; color:#d5e1d8 }.completada{background:#174c34;color:#89e5b1}.pendiente,.completada_parcial,.en_progreso{background:#4a3818;color:#ffd879}.fallida,.cancelada{background:#512527;color:#ffa6a6}.requiere_revision{background:#203d57;color:#a9d8ff}.detail { padding:17px; min-height:480px }.detail h2 { margin-bottom:4px; font:700 22px Georgia,serif }.detail .meta { color:var(--muted); margin-bottom:16px }.block { border-top:1px solid var(--line); padding:13px 0 }.event { border-left:3px solid var(--line); padding:4px 0 4px 9px; margin:8px 0 }.event strong { display:block }.risk { color:var(--red); font-weight:700 }.empty { color:var(--muted); padding:28px; text-align:center } .hidden { display:none!important }
    @media(max-width:900px){ #app{padding:15px}.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.detail{min-height:auto}table th:nth-child(4),table td:nth-child(4){display:none}header{flex-direction:column}.actions{width:100%}.actions button{flex:1} }
  </style>
</head>
<body>
  <main id="auth" class="auth"><div class="eyebrow">DiaSky / Control operativo</div><h1>Acceso privado</h1><p>Ingresa el token administrativo. Se guarda solo mientras esta pestaña permanezca abierta.</p><form id="loginForm"><input id="token" name="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus placeholder="ADMIN_TOKEN" aria-label="Token administrativo"><button type="submit" style="width:100%;margin-top:12px">Entrar al panel</button></form><div id="authError" class="error"></div></main>
  <main id="app"><header><div><div class="eyebrow">Operaciones de campo</div><h1>Tablero diario</h1></div><div class="actions"><button class="subtle" id="refresh">Actualizar</button><button class="subtle" id="logout">Salir</button></div></header>
    <section id="metrics" class="metrics"></section><section class="filters"><input id="date" type="date"><input id="locality" placeholder="Filtrar zona"><select id="status"><option value="">Todos los estados</option><option value="pendiente">Pendiente</option><option value="completada">Completada</option><option value="completada_parcial">Parcial</option><option value="fallida">Fallida</option><option value="cancelada">Cancelada</option><option value="requiere_revision">Revisar</option></select><select id="risk"><option value="">Todo riesgo</option><option value="true">Con riesgo</option></select><button id="apply">Filtrar</button></section>
    <section class="workspace"><div class="list"><table><thead><tr><th>Estado</th><th>Zona / actividad</th><th>Cliente</th><th>Disponibilidad</th></tr></thead><tbody id="orders"></tbody></table></div><aside id="detail" class="detail"><div class="empty">Selecciona una orden para ver su trazabilidad.</div></aside></section>
  </main>
  <script>
    const $=id=>document.getElementById(id), state={token:sessionStorage.getItem('diask-token'),orders:[],selected:null};
    const labels={completada:'Completada',pendiente:'Pendiente',fallida:'Fallida',cancelada:'Cancelada',en_progreso:'En progreso',completada_parcial:'Parcial',requiere_revision:'Revisar'};
    const api=async(path,opts={})=>{const res=await fetch(path,{...opts,headers:{'Authorization':'Bearer '+state.token,'Content-Type':'application/json',...(opts.headers||{})}});if(res.status===401){logout();throw Error('Token inválido')}if(!res.ok)throw Error('Error '+res.status);return res.json()};
    const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function logout(){sessionStorage.removeItem('diask-token');state.token=null;$('app').style.display='none';$('auth').style.display='block';$('token').value=''}
    async function login(){state.token=$('token').value.trim();try{await api('/orders?scheduled_date='+new Date().toISOString().slice(0,10));sessionStorage.setItem('diask-token',state.token);$('auth').style.display='none';$('app').style.display='block';load()}catch(e){$('authError').textContent=e.message}}
    function metrics(orders){const groups={total:orders.length,completada:0,pendiente:0,sin_reporte:0,riesgo:0};orders.forEach(o=>{if(o.status==='completada')groups.completada++;else if(o.status==='pendiente'&&!o.availability_note)groups.sin_reporte++;else if(o.status!=='completada')groups.pendiente++;if(o.safety_risk)groups.riesgo++});$('metrics').innerHTML=[['Total',groups.total],['Completadas',groups.completada],['Pendientes',groups.pendiente],['Sin reporte',groups.sin_reporte],['Riesgo',groups.riesgo]].map(([l,n])=>`<div class="metric"><b>${n}</b><span>${l}</span></div>`).join('')}
    async function load(){const q=new URLSearchParams();if($('date').value)q.set('scheduled_date',$('date').value);if($('locality').value)q.set('locality',$('locality').value);if($('status').value)q.set('status',$('status').value);state.orders=await api('/orders?'+q);if($('risk').value)state.orders=state.orders.filter(o=>o.safety_risk);metrics(state.orders);$('orders').innerHTML=state.orders.length?state.orders.map(o=>`<tr class="order ${state.selected===o.id?'selected':''}" data-id="${o.id}"><td><span class="badge ${o.status}">${labels[o.status]||o.status}</span>${o.safety_risk?' <span class="risk">Riesgo</span>':''}</td><td><b>${esc(o.locality||'Sin zona')}</b><br><small>${esc(o.type)}</small></td><td>${esc(o.customer_name||'Sin cliente')}</td><td>${esc(o.availability_note||'-')}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No hay órdenes con estos filtros.</td></tr>';document.querySelectorAll('tr.order').forEach(row=>row.onclick=()=>detail(+row.dataset.id))}
    async function detail(id){state.selected=id;const o=await api('/orders/'+id);$('detail').innerHTML=`<h2>${esc(o.locality||'Sin zona')}</h2><div class="meta">${esc(o.type)} · ${esc(o.customer_name||'Sin cliente')}</div><span class="badge ${o.status}">${labels[o.status]||o.status}</span>${o.safety_risk?' <span class="risk">Riesgo de seguridad</span>':''}<div class="block"><b>Datos del cliente</b><p>${esc(o.customer_name||'-')}<br>${esc(o.customer_document||'Sin documento')}<br>${esc(o.address||'Sin dirección')}<br>${esc((o.phones||[]).join(' · ')||'Sin teléfono')}<br>${esc(o.email||'Sin correo')}</p><p><b>Servicio:</b> ${esc(o.plan||'Sin plan')}<br><b>Instalación:</b> ${esc(o.installation_value||'Sin valor')}</p></div><div class="block"><b>Disponibilidad</b><p>${esc(o.availability_note||'Sin nota')}</p>${o.requires_customer_confirmation?'<small>Requiere confirmación cliente.</small>':''}</div><div class="block"><b>Equipo asignado</b><p>${o.assignments.length?o.assignments.map(a=>esc(a.technician)).join(', '):'Sin asignación registrada'}</p></div><div class="block"><b>Eventos</b>${o.events.length?o.events.map(e=>`<div class="event"><strong>${labels[e.status]||e.status}</strong>${esc(e.reason_code||'')} ${esc(e.reason_text||'')}<br><small>${esc(e.source)} · ${new Date(e.occurred_at).toLocaleString()}</small></div>`).join(''):'<p>Sin eventos aún.</p>'}</div><div class="block"><b>Corrección manual</b><select id="correctStatus">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===o.status?'selected':''}>${l}</option>`).join('')}</select><input id="correctReason" placeholder="Motivo de corrección" style="margin-top:8px"><button id="saveCorrection" style="margin-top:8px">Guardar corrección</button><button id="deleteOrder" class="danger" style="margin-top:8px;margin-left:6px">Eliminar orden</button></div>`;$('saveCorrection').onclick=async()=>{await api('/orders/'+id,{method:'PATCH',body:JSON.stringify({status:$('correctStatus').value,reason_text:$('correctReason').value||null,actor:'panel'})});await load();detail(id)};$('deleteOrder').onclick=async()=>{if(!confirm('¿Eliminar esta orden y su historial de eventos?'))return;await api('/orders/'+id,{method:'DELETE'});state.selected=null;$('detail').innerHTML='<div class="empty">Orden eliminada.</div>';load()};load()}
    $('loginForm').onsubmit=e=>{e.preventDefault();login()};$('logout').onclick=logout;$('refresh').onclick=load;$('apply').onclick=load;$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());if(state.token){$('auth').style.display='none';$('app').style.display='block';load()}else{$('token').focus()}setInterval(()=>state.token&&load(),30000);
  </script>
</body></html>
